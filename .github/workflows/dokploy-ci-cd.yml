name: CI/CD Pipeline - Dokploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REGISTRY_URL: ${{ secrets.REGISTRY_URL || vars.REGISTRY_URL }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME || vars.IMAGE_NAME || 'himatif-profile' }}

jobs:
  test-and-lint:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "mysql://mock:mock@localhost:3306/mock"
      BETTER_AUTH_SECRET: "ci-test-secret-value-32charslong"
      BETTER_AUTH_URL: "http://localhost:3000"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check SvelteKit Types & Sync
        run: npm run check

      - name: Run Linter & Formatter Check
        run: npm run lint

  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Registry & Image Target
        id: prep
        run: |
          if [ -n "$REGISTRY_URL" ]; then
            FULL_IMAGE="${REGISTRY_URL}/${IMAGE_NAME}"
          else
            FULL_IMAGE="${IMAGE_NAME}"
          fi
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Custom Container Registry
        if: github.event_name != 'pull_request' && env.REGISTRY_URL != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.full_image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Trigger Dokploy Deployment Webhook
        if: github.event_name != 'pull_request'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Triggering Dokploy deployment webhook..."
            curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{}'
          else
            echo "DOKPLOY_WEBHOOK_URL not configured. Skipping webhook trigger."
          fi
